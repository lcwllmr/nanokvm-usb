name: release AppImage

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libxss1 \
            libxtst6 \
            libatspi2.0-0 \
            libdrm2 \
            libgbm1 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libxkbcommon0 \
            libxi6 \
            libxrender1 \
            libglib2.0-0 \
            libgdk-pixbuf-2.0-0 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libdbus-1-3 \
            libfuse2

      - name: install Node dependencies
        run: npm install

      - name: build linux AppImage
        run: npm run build:linux

      - name: derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: normalize AppImage name
        run: |
          appimage_path="$(ls dist/*.AppImage | head -n 1)"
          target="dist/nanokvm-usb-${{ steps.version.outputs.version }}.AppImage"
          if [ "$appimage_path" != "$target" ]; then
            mv "$appimage_path" "$target"
          fi

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nanokvm-usb-${{ steps.version.outputs.version }}.AppImage
