name: release AppImage

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          cache: true

      - name: checkout
        uses: actions/checkout@v4

      - name: install Node dependencies
        run: pnpm install

      - name: build linux AppImage
        run: pnpm run build:linux

      - name: derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: normalize AppImage name
        run: |
          appimage_path="$(ls dist/*.AppImage | head -n 1)"
          target="dist/nanokvm-usb-${{ steps.version.outputs.version }}.AppImage"
          if [ "$appimage_path" != "$target" ]; then
            mv "$appimage_path" "$target"
          fi

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nanokvm-usb-${{ steps.version.outputs.version }}.AppImage
